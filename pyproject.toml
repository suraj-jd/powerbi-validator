[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[project]
name = "powerbi-validation-tool"
version = "0.1.0"
description = "Local-first Windows desktop application for Power BI report and semantic model validation."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.8.0,<6.11.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-qt>=4.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
qt_api = "pyside6"
